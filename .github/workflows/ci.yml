# docs/PHASE_PILOT_RELEASE.md §6, confirmed: `make check`/`npm run check`
# on every push and PR, then build+push images and deploy to staging
# automatically on every merge to main. Production is a deliberate,
# separate promotion -- see deploy-production.yml -- never driven by the
# same push that deploys staging.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: justbarme_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JBM_DATABASE_URL: postgres://postgres:postgres@localhost:5432/justbarme_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install the migrate CLI
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest

      - name: Run migrations
        run: make migrate-up

      # make check == fmt-check + vet + test, against the real Postgres
      # service above -- CLAUDE.md is explicit that tenant-isolation
      # coverage is silently skipped without a real database, so this is
      # not optional the way it might look for a typical Go project.
      - name: make check
        run: make check

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high

  build-and-push:
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "value=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/justbarme-api:${{ steps.tag.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/justbarme-api:latest

      - uses: docker/build-push-action@v5
        with:
          context: web
          file: web/Dockerfile
          push: true
          build-args: |
            VITE_OFFLINE_SIGNING_PUBLIC_KEY=${{ secrets.VITE_OFFLINE_SIGNING_PUBLIC_KEY }}
            VITE_GOOGLE_OAUTH_CLIENT_ID=${{ secrets.VITE_GOOGLE_OAUTH_CLIENT_ID }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/justbarme-web:${{ steps.tag.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/justbarme-web:latest

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # Requires STAGING_SSH_HOST/USER/KEY repository secrets --
      # see docs/DEPLOYMENT.md §5. Until they're set, this step fails at
      # the SSH connection, which is expected on a repo with no staging
      # VPS provisioned yet, not a workflow bug.
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/justbarme
            git pull
            IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }} COMPOSE_PROJECT_DIR=/opt/justbarme ./scripts/deploy-release.sh
